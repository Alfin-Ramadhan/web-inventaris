version: '3.8'
services:
  app:
    image: ghcr.io/alfin-ramadhan/web-inventaris:main
    ports:
      - "80:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://3.81.142.73"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - sqlite-data:/var/www/html/database
volumes:
  sqlite-data:
    driver: local
